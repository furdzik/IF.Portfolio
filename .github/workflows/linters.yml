name: Linters

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  suite:
    runs-on: ubuntu-latest
    name: Run linters
    steps:
      - uses: actions/checkout@v2
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run linters
        run: yarn lint
